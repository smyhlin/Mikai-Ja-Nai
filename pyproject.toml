[project]
name = "mikai-wrapper"
version = "0.1.0"
description = "Desktop client for the Mikai public anime API"
requires-python = ">=3.14"
dependencies = [
    "py7zr>=1.1.3",
    "PySide6>=6.10",
    "python-mpv>=1.0.8",
    "requests>=2.32",
]

[project.scripts]
mikai-wrapper = "mikai_ui.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mikai_backend", "mikai_ui"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.ruff]
line-length = 100
target-version = "py314"
