<!--
  Reference drawing only: neither stylesheet loads this file any more. A
  stylesheet `image:' is a fixed-size raster that Qt upscales on a HiDPI
  display, so both combo sheets leave the arrow to the style, which paints
  PE_IndicatorArrowDown from the palette at the device ratio. The shape and the
  1.4/10 stroke weight here are what that arrow is meant to look like.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 10 10">
  <path d="M2 3.6 L5 6.4 L8 3.6" fill="none" stroke="#8b8b96" stroke-width="1.4"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
